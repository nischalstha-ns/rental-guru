name: rental_management_system
description: A production-ready rental management system built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  riverpod_annotation: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Image Handling
  image_picker: ^1.1.2
  camera: ^0.11.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # File Handling
  file_picker: ^8.1.7

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Date Formatting
  intl: ^0.20.2

  # UI Utilities
  flutter_slidable: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  badges: ^3.1.2

  # Form Validation
  form_field_validator: ^1.1.0

  # Charts / Stats
  fl_chart: ^0.70.2

  # Permissions
  permission_handler: ^11.4.0

  # Local Storage (for session persist)
  shared_preferences: ^2.5.2

  # HTTP for edge functions
  dio: ^5.8.0+1
  http: ^1.3.0

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  go_router_builder: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
